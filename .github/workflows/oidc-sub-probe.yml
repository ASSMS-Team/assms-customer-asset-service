name: OIDC Subject Probe

on:
  push:
    branches:
      - ASSMS-210-staging-cd-pipeline

permissions:
  contents: read
  id-token: write

jobs:
  print-oidc-subject:
    runs-on: ubuntu-latest
    steps:
      - name: Request and inspect OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          audience = "api://AzureADTokenExchange"
          request_url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience="
              + urllib.parse.quote(audience, safe="")
          )
          request = urllib.request.Request(
              request_url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          subject = claims.get("sub")
          actual_audience = claims.get("aud")
          if not isinstance(subject, str) or not isinstance(actual_audience, str):
              raise SystemExit("OIDC response did not include string sub and aud claims.")

          print("OIDC_SUB=" + subject)
          print("OIDC_AUD=" + actual_audience)
          PY
