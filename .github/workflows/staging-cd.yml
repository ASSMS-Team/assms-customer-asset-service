name: Customer Asset Service Staging CD

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact commit SHA validated by the calling CI workflow.
        required: true
        type: string
      source_ref:
        description: Source ref validated by the calling CI workflow.
        required: true
        type: string
    secrets:
      CUSTOMER_DEPLOY_SSH_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: customer-asset-staging-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Customer and Asset Service to staging
    if: inputs.source_ref == 'refs/heads/dev' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      CUSTOMER_API_URL: ${{ vars.CUSTOMER_API_URL }}
      CUSTOMER_NSG_NAME: ${{ vars.CUSTOMER_NSG_NAME }}
      CUSTOMER_TEMP_SSH_RULE_PRIORITY: ${{ vars.CUSTOMER_TEMP_SSH_RULE_PRIORITY }}
      CUSTOMER_VM_HOST: ${{ vars.CUSTOMER_VM_HOST }}
      CUSTOMER_VM_SSH_USERNAME: ${{ vars.CUSTOMER_VM_SSH_USERNAME }}
      DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}
      IMAGE_NAME: assms-customer-service
      TEMP_SSH_RULE_NAME: gh-cd-customer-${{ github.run_id }}

    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag "${IMAGE_NAME}:${DEPLOY_SHA}" \
            .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_NAME}:${DEPLOY_SHA}")" = "linux/arm64"
          docker save "${IMAGE_NAME}:${DEPLOY_SHA}" | gzip -c > customer-image.tar.gz

      - name: Authenticate to Azure with OIDC
        id: azure_login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare dedicated deployment SSH key
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CUSTOMER_DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/customer_deploy_ed25519
          printf '%s\n' "${{ vars.CUSTOMER_VM_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/customer_deploy_ed25519 ~/.ssh/known_hosts

      - name: Allow temporary SSH from this runner only
        id: temporary_ssh
        run: |
          runner_ip="$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)"
          test -n "$runner_ip"
          az network nsg rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --nsg-name "$CUSTOMER_NSG_NAME" \
            --name "$TEMP_SSH_RULE_NAME" \
            --priority "$CUSTOMER_TEMP_SSH_RULE_PRIORITY" \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-address-prefixes "${runner_ip}/32" \
            --source-port-ranges '*' \
            --destination-address-prefixes '*' \
            --destination-port-ranges 22

      - name: Transfer ARM64 image to Customer VM
        run: |
          scp -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/customer_deploy_ed25519 \
            customer-image.tar.gz \
            "${CUSTOMER_VM_SSH_USERNAME}@${CUSTOMER_VM_HOST}:/tmp/customer-image-${DEPLOY_SHA}.tar.gz"

      - name: Replace Customer container and confirm Nginx
        run: |
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/customer_deploy_ed25519 \
            "${CUSTOMER_VM_SSH_USERNAME}@${CUSTOMER_VM_HOST}" \
            "sudo docker load -i /tmp/customer-image-${DEPLOY_SHA}.tar.gz && \
             sudo rm -f /tmp/customer-image-${DEPLOY_SHA}.tar.gz && \
             sudo docker run --rm --env-file /etc/assms/customer.env \
               ${IMAGE_NAME}:${DEPLOY_SHA} --apply-auth-migration && \
             sudo docker rm -f assms-customer-service || true"
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/customer_deploy_ed25519 \
            "${CUSTOMER_VM_SSH_USERNAME}@${CUSTOMER_VM_HOST}" \
            "sudo docker run -d --name assms-customer-service --restart unless-stopped \
             --env-file /etc/assms/customer.env \
             -p 127.0.0.1:8080:8080 \
             ${IMAGE_NAME}:${DEPLOY_SHA} && \
             sudo systemctl is-active --quiet nginx && \
             sudo docker ps --filter name=assms-customer-service --format '{{.Image}}' | grep -Fx '${IMAGE_NAME}:${DEPLOY_SHA}'"

      - name: Verify public HTTPS health endpoints
        run: |
          for path in /api/health /api/health/db; do
            status="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              --output /dev/null --write-out '%{http_code}' "${CUSTOMER_API_URL}${path}")"
            test "$status" = "200"
          done

      - name: Remove temporary SSH rule
        if: always() && steps.azure_login.outcome == 'success'
        run: |
          az network nsg rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --nsg-name "$CUSTOMER_NSG_NAME" \
            --name "$TEMP_SSH_RULE_NAME" || true
